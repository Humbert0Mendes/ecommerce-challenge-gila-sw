services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_order
      POSTGRES_USER: product_order
      POSTGRES_PASSWORD: product_order
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_order -d product_order"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
