spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_order}
    username: ${DB_USERNAME:product_order}
    password: ${DB_PASSWORD:product_order}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
